[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-figure-studio"
version = "0.2.0"
description = "Reproducible, publication-ready academic figure packages from real research outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Muhtasim Munif Fahim", email = "s1911024120@ru.ac.bd" },
]
keywords = ["scientific-figures", "publication", "matplotlib", "reproducible-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Muhtasim-Munif-Fahim/journal-figure-studio"
Issues = "https://github.com/Muhtasim-Munif-Fahim/journal-figure-studio/issues"
Documentation = "https://github.com/Muhtasim-Munif-Fahim/journal-figure-studio#readme"
Changelog = "https://github.com/Muhtasim-Munif-Fahim/journal-figure-studio/blob/main/CHANGELOG.md"

[project.scripts]
render-figure = "scripts.render_recipe:main"
render-figures = "scripts.render_batch:main"
validate-request = "scripts.validate_request:main"
validate-requests = "scripts.validate_batch:main"
validate-profile = "scripts.validate_profile:main"
check-package = "scripts.check_package:main"
inspect-data = "scripts.inspect_results:main"
create-profile = "scripts.create_venue_profile:main"
audit-palette = "scripts.audit_palette:main"
audit-colorblind = "scripts.audit_colorblind:main"
audit-caption = "scripts.audit_caption:main"
compare-figures = "scripts.compare_packages:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
    # tests/test_common.py round-trips parquet and feather, both of which
    # pandas delegates to pyarrow.
    "pyarrow>=15.0",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "cli: CLI tests",
    "slow: Slow tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["build/", "dist/"]

# numpy ships stubs that use PEP 695 `type` statements. Checking this project
# against its minimum supported runtime (3.10) makes mypy parse those stubs
# under 3.10 syntax rules and abort before it reaches our own code. Skipping
# the import keeps the project's own target at 3.10 without type-checking
# numpy's stubs for us.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["D100", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/__init__.py" = ["D"]
"scripts/version.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
