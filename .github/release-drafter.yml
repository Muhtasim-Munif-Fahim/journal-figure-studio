name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Features
    labels: [enhancement, feature]
  - title: Bug Fixes
    labels: [bug, fix]
  - title: Documentation
    labels: [documentation, docs]
  - title: Infrastructure
    labels: [infrastructure, build, ci]
change-template: "- $TITLE (#$NUMBER)"
template: |
  ## Changes
  $CHANGES
