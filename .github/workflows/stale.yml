name: Stale

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been marked stale."
          stale-pr-message: "This PR has been marked stale."
          days-before-stale: 90
          days-before-close: 30
