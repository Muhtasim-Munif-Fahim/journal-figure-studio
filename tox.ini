[tox]
envlist = py310, py311, py312, py313

[testenv]
deps =
    -rrequirements-dev.txt
commands =
    pytest tests/ -v --tb=short

[testenv:lint]
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    numpy
    pandas-stubs
    matplotlib
    pyyaml
commands = mypy scripts/
